name: Deploy to Stage

on:
  push:
    tags:
      - 'v*-rc*'

env:
  SERVICE_NAME: acueducto-backend

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Run tests and quality checks
        run: |
          chmod +x gradlew
          ./gradlew test checkstyleMain spotbugsMain --no-daemon

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/reports/

  build-and-push:
    runs-on: ubuntu-latest
    needs: test
    environment: stage
    steps:
      - uses: actions/checkout@v4

      - name: Login to Huawei SWR
        run: |
          docker login -u "${{ vars.SWR_REGION }}@${{ secrets.SWR_AK }}" \
            -p "${{ secrets.SWR_LOGIN_KEY }}" \
            "swr.${{ vars.SWR_REGION }}.myhuaweicloud.com"

      - name: Build and push Docker image
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          IMAGE="swr.${{ vars.SWR_REGION }}.myhuaweicloud.com/${{ vars.SWR_ORGANIZATION }}/${{ env.SERVICE_NAME }}"
          docker build -t $IMAGE:$TAG .
          docker tag $IMAGE:$TAG $IMAGE:latest
          docker push $IMAGE:$TAG
          docker push $IMAGE:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: stage
    steps:
      - name: Create deploy script
        run: |
          cat > deploy.sh << 'EOF'
          #!/bin/bash
          CONTAINER="acueducto-backend"
          IMAGE="swr.${{ vars.SWR_REGION }}.myhuaweicloud.com/${{ vars.SWR_ORGANIZATION }}/acueducto-backend:${{ github.ref_name }}"

          docker stop $CONTAINER 2>/dev/null || true
          docker rm $CONTAINER 2>/dev/null || true
          docker rmi $(docker images --filter=reference="*/acueducto-backend*" -q) 2>/dev/null || true

          docker login -u "${{ vars.SWR_REGION }}@${{ secrets.SWR_AK }}" \
            -p "${{ secrets.SWR_LOGIN_KEY }}" \
            "swr.${{ vars.SWR_REGION }}.myhuaweicloud.com"

          docker pull $IMAGE

          docker run -d \
            --name $CONTAINER \
            --restart unless-stopped \
            -p ${{ vars.HOST_PORT }}:8083 \
            -e SPRING_PROFILES_ACTIVE=huawei \
            -e DB_URL="${{ secrets.DB_URL }}" \
            -e DB_USERNAME="${{ secrets.DB_USERNAME }}" \
            -e DB_PASSWORD="${{ secrets.DB_PASSWORD }}" \
            $IMAGE
          EOF
          chmod +x deploy.sh

      - name: Copy script to ECS
        env:
          SSHPASS: ${{ secrets.ECS_PASSWORD }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
          sshpass -e scp -o StrictHostKeyChecking=no deploy.sh ${{ secrets.ECS_USER }}@${{ secrets.ECS_HOST }}:/tmp/deploy.sh

      - name: Execute deploy on ECS
        env:
          SSHPASS: ${{ secrets.ECS_PASSWORD }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=no ${{ secrets.ECS_USER }}@${{ secrets.ECS_HOST }} "bash /tmp/deploy.sh && rm /tmp/deploy.sh"

  notify:
    runs-on: ubuntu-latest
    needs: deploy
    if: always()
    steps:
      - name: Set status message
        id: status
        run: |
          if [[ "${{ needs.deploy.result }}" == "success" ]]; then
            echo "emoji=✅" >> $GITHUB_OUTPUT
            echo "text=Deploy exitoso" >> $GITHUB_OUTPUT
          else
            echo "emoji=❌" >> $GITHUB_OUTPUT
            echo "text=Deploy fallido" >> $GITHUB_OUTPUT
          fi

      - name: Notify Slack
        if: vars.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v2
        with:
          webhook: ${{ vars.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "${{ steps.status.outputs.emoji }} *${{ env.SERVICE_NAME }}* | `${{ github.ref_name }}` → *stage*\n${{ steps.status.outputs.text }}\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|Ver pipeline>"
            }

      - name: Notify Microsoft Teams
        if: vars.TEAMS_WEBHOOK_URL != ''
        run: |
          curl -H "Content-Type: application/json" -d '{
            "text": "${{ steps.status.outputs.emoji }} **${{ env.SERVICE_NAME }}** | `${{ github.ref_name }}` → **stage** — ${{ steps.status.outputs.text }} — [Ver pipeline](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          }' ${{ vars.TEAMS_WEBHOOK_URL }}
