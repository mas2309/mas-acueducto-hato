<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1e293b">
    <title>Sin conexión - Acueducto El Hato</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            color: #0f172a;
        }
        .card {
            width: 100%;
            max-width: 380px;
            background: #fff;
            border-radius: 1rem;
            padding: 2rem 1.75rem;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, .25);
        }
        .card img { width: 64px; height: 64px; border-radius: 1rem; }
        h1 { font-size: 1.15rem; margin: 1rem 0 .5rem; }
        p { font-size: .9rem; color: #64748b; margin: 0 0 1.5rem; line-height: 1.5; }
        button {
            width: 100%;
            border: 0;
            border-radius: .5rem;
            padding: .7rem 1rem;
            font-size: .95rem;
            font-weight: 600;
            color: #fff;
            background: #0d6efd;
            cursor: pointer;
        }
        button:hover { background: #0a58ca; }
    </style>
</head>
<body>
    <main class="card">
        <img src="/static/img/pwa/icon-192.png" alt="">
        <h1>Sin conexión a internet</h1>
        <p>El panel del acueducto necesita conexión para consultar y guardar la información.
            Revisa tu conexión e inténtalo de nuevo.</p>
        <button type="button" onclick="location.reload()">Reintentar</button>
    </main>
    <script>
        window.addEventListener('online', function () { location.reload(); });
    </script>
</body>
</html>
