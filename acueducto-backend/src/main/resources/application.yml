spring:
  profiles:
    active: dev
  application:
    name: acueducto-backend-api
  web:
    resources:
      add-mappings: false

server:
  port: 8084

spring.servlet.multipart:
  enabled: true
  max-file-size: 10MB
  max-request-size: 10MB

spring.flyway:
  enabled: true
  schemas: acueducto
  default-schema: acueducto
  baseline-on-migrate: true
  baseline-version: "2"
  baseline-description: "Esquema existente previo a Flyway"

logging:
  level:
    com.mas.co: DEBUG
    org.springframework.web: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# Configuración de facturación
acueducto:
  facturacion:
    dia-limite-pago: 20

# Seguridad JWT
security:
  jwt:
    secret-key: ${JWT_SECRET_KEY:dGhpcyBpcyBhIHNlY3VyZSBrZXkgZm9yIGFjdWVkdWN0byBiYWNrZW5kIGFwaSBtYXMgZGV2ZWxvcG1lbnQ=}
    access-token-expiration: 3600000
    refresh-token-expiration: 604800000

# Almacenamiento de archivos (Contabo Object Storage, S3-compatible, en la VPS)
storage:
  endpoint: ${STORAGE_ENDPOINT:https://usc1.contabostorage.com}
  tenant-id: ${STORAGE_TENANT_ID:}
  access-key: ${CONTABO_ACCESS_KEY:}
  secret-key: ${CONTABO_SECRET_KEY:}
  bucket: ${STORAGE_BUCKET:acueducto-hato}