spring:
  datasource:
    url: "jdbc:postgresql://localhost:5432/acueducto_hato"
    username: postgres
    password: "Mas23"
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true

  flyway:
    enabled: false

logging:
  level:
    org.springframework.transaction: DEBUG
    org.springframework.orm.jpa: DEBUG
    org.springframework.security: DEBUG
    com.mas.co: DEBUG

# JWT dev - clave para desarrollo local (1h access, 7d refresh)
security:
