    secret-key: ZGV2LXNlY3JldC1rZXktYWN1ZWR1Y3RvLWJhY2tlbmQtYXBpLW1hcy1kZXZlbG9wbWVudC10ZWFt
    access-token-expiration: 3600000
    refresh-token-expiration: 604800000